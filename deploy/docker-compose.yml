# Dependencies + full stack for local development and integration tests.
#   Deps only:   docker compose -f deploy/docker-compose.yml up -d postgres redis minio
#   Full stack:  docker compose -f deploy/docker-compose.yml up -d --build
name: webhookd

x-webhookd-env: &webhookd-env
  WEBHOOKD_POSTGRES_DSN: postgres://webhookd:webhookd@postgres:5432/webhookd?sslmode=disable
  WEBHOOKD_REDIS_ADDR: redis:6379
  WEBHOOKD_S3_ENDPOINT: minio:9000
  WEBHOOKD_S3_ACCESS_KEY: minioadmin
  WEBHOOKD_S3_SECRET_KEY: minioadmin
  # Dev-only values. Never reuse in production.
  WEBHOOKD_MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcy0hISE=
  WEBHOOKD_ADMIN_KEY: dev-admin-key
  # The mock receiver lives on this private network, so allow it explicitly.
  WEBHOOKD_ALLOW_HTTP: "true"
  WEBHOOKD_SSRF_ALLOW_CIDRS: 10.89.50.0/24

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: webhookd
      POSTGRES_PASSWORD: webhookd
      POSTGRES_DB: webhookd
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=1GB", "-c", "synchronous_commit=on"]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhookd"]
      interval: 2s
      retries: 30
    networks: [whk]

  # Two-node PostgreSQL HA cluster (primary + synchronous streaming standby)
  # for failover tests. Roles are elected at start by deploy/pg-ha/entrypoint.sh.
  #   docker compose -f deploy/docker-compose.yml --profile ha up -d pg-a pg-b
  pg-a: &pg-ha
    image: docker.io/library/postgres:17-alpine
    profiles: [ha]
    hostname: pg-a
    entrypoint: ["/pg-ha/entrypoint.sh"]
    command: ["postgres", "-c", "max_connections=300", "-c", "wal_keep_size=256MB"]
    environment:
      POSTGRES_USER: webhookd
      POSTGRES_PASSWORD: webhookd
      POSTGRES_DB: webhookd
      PGDATA: /pgdata/data
      PG_PEERS: pg-a pg-b
    volumes:
      - ./pg-ha/entrypoint.sh:/pg-ha/entrypoint.sh:ro
      - ./pg-ha/initdb-primary.sh:/docker-entrypoint-initdb.d/10-ha.sh:ro
    tmpfs: [/pgdata]
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U webhookd"]
      interval: 2s
      retries: 60
    networks: [whk]

  pg-b:
    <<: *pg-ha
    hostname: pg-b
    ports: ["127.0.0.1:55434:5432"]
    depends_on:
      pg-a: { condition: service_healthy }

  redis:
    image: docker.io/library/redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    networks: [whk]

  # Single-node Redis Cluster (all 16384 slots on one node). Used only by
  # the Cluster compatibility tests: it enforces CROSSSLOT rules exactly
  # like a multi-node cluster. Same port inside and out, so the announced
  # address works from the host.
  redis-cluster:
    image: docker.io/library/redis:7.4-alpine
    profiles: [test]
    command: ["sh", "-c", "redis-server --port 47000 --cluster-enabled yes --cluster-config-file /tmp/nodes.conf --cluster-announce-ip 127.0.0.1 --appendonly no & sleep 1 && redis-cli -p 47000 cluster addslotsrange 0 16383 && wait"]
    ports: ["127.0.0.1:47000:47000"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 47000 cluster info | grep -q cluster_state:ok"]
      interval: 2s
      retries: 30
    networks: [whk]

  minio:
    image: docker.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:59000:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30
    networks: [whk]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["api"]
    environment: *webhookd-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [whk]

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["worker"]
    environment: *webhookd-env
    depends_on: [api]
    deploy: { replicas: 2 }
    networks: [whk]

  scheduler:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["scheduler"]
    environment: *webhookd-env
    depends_on: [api]
    networks: [whk]

  receiver:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/mockreceiver"]
    ports: ["127.0.0.1:8090:8090"]
    networks:
      whk: { ipv4_address: 10.89.50.100 }

networks:
  whk:
    ipam:
      config:
        - subnet: 10.89.50.0/24
