apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhookd-worker
  labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: worker }
spec:
  replicas: 4
  selector:
    matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Must exceed WEBHOOKD_SHUTDOWN_TIMEOUT so in-flight attempts finish
      # and record their outcome; anything left is reclaimed via XAUTOCLAIM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: worker }
      containers:
        - name: worker
          image: webhookd
          args: ["worker"]
          ports: [{ name: metrics, containerPort: 9090 }]
          envFrom:
            - configMapRef: { name: webhookd }
            - secretRef: { name: webhookd }
          resources:
            requests: { cpu: "2", memory: 1500Mi } # 512Mi payload cache + in-flight bodies
            limits: { memory: 3Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webhookd-worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: webhookd-worker }
  minReplicas: 4
  maxReplicas: 32
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
    # Optional: scale on backlog via prometheus-adapter exposing webhook_queue_lag.
    # - type: External
    #   external:
    #     metric: { name: webhook_queue_lag }
    #     target: { type: AverageValue, averageValue: "2000" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhookd-worker
spec:
  maxUnavailable: 25%
  selector:
    matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: worker }
