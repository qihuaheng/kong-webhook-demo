apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhookd-api
  labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
      containers:
        - name: api
          image: webhookd
          args: ["api"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: webhookd }
            - secretRef: { name: webhookd }
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          lifecycle:
            # Let the load balancer drop the pod before the server stops accepting.
            preStop: { sleep: { seconds: 5 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: webhookd-api
  labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webhookd-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: webhookd-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhookd-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: api }
