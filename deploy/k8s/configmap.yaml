apiVersion: v1
kind: ConfigMap
metadata:
  name: webhookd
data:
  WEBHOOKD_HTTP_ADDR: ":8080"
  WEBHOOKD_METRICS_ADDR: ":9090"
  WEBHOOKD_S3_BUCKET: webhookd-payloads
  WEBHOOKD_S3_USE_SSL: "true"
  WEBHOOKD_S3_REGION: eu-west-1
  # Production Redis is Redis Cluster: WEBHOOKD_REDIS_ADDR (Secret) lists seed nodes.
  WEBHOOKD_REDIS_CLUSTER: "true"
  WEBHOOKD_SHARDS: "16"
  WEBHOOKD_INLINE_THRESHOLD: "65536"
  WEBHOOKD_MAX_PAYLOAD_BYTES: "262144"
  WEBHOOKD_PAYLOAD_CACHE_BYTES: "536870912"
  WEBHOOKD_WORKER_CONCURRENCY: "1000"
  WEBHOOKD_ENDPOINT_CONCURRENCY: "50"
  WEBHOOKD_CLAIM_IDLE: 60s
  WEBHOOKD_PAYLOAD_RETENTION: 240h
  WEBHOOKD_METADATA_RETENTION: 720h
  WEBHOOKD_SHUTDOWN_TIMEOUT: 30s
  # WEBHOOKD_OTLP_ENDPOINT: otel-collector.observability:4317
