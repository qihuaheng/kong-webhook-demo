# Template only — do not commit real values. Prefer an external secret
# manager (External Secrets Operator, Sealed Secrets, Vault) in production.
apiVersion: v1
kind: Secret
metadata:
  name: webhookd
  namespace: webhookd
type: Opaque
stringData:
  # PostgreSQL HA: list every node (the client always picks the writable one),
  # or use a single writer endpoint / VIP. Requires synchronous replication
  # (design §8.5). Do not set target_session_attrs other than read-write.
  WEBHOOKD_POSTGRES_DSN: postgres://webhookd:CHANGE_ME@pg-0.example.internal:5432,pg-1.example.internal:5432,pg-2.example.internal:5432/webhookd?sslmode=verify-full
  # Redis topology:
  #   standalone: one host:port
  #   Sentinel:   comma-separated sentinel addresses + WEBHOOKD_REDIS_MASTER_NAME
  #   Cluster:    comma-separated seed nodes (or one address + WEBHOOKD_REDIS_CLUSTER=true)
  WEBHOOKD_REDIS_ADDR: redis.example.internal:6379
  # WEBHOOKD_REDIS_MASTER_NAME: mymaster
  # WEBHOOKD_REDIS_CLUSTER: "true"
  WEBHOOKD_REDIS_PASSWORD: CHANGE_ME
  WEBHOOKD_S3_ENDPOINT: s3.eu-west-1.amazonaws.com
  WEBHOOKD_S3_ACCESS_KEY: CHANGE_ME
  WEBHOOKD_S3_SECRET_KEY: CHANGE_ME
  # base64 of 32 random bytes: openssl rand -base64 32
  WEBHOOKD_MASTER_KEY: CHANGE_ME
  WEBHOOKD_ADMIN_KEY: CHANGE_ME
