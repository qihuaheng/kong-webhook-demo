# The scheduler's loops are safe on multiple replicas (Lua-atomic moves,
# advisory locks, consumer-group notifier); 2 replicas give availability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhookd-scheduler
  labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: scheduler }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: scheduler }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: scheduler }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scheduler
          image: webhookd
          args: ["scheduler"]
          ports: [{ name: metrics, containerPort: 9090 }]
          envFrom:
            - configMapRef: { name: webhookd }
            - secretRef: { name: webhookd }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhookd-scheduler
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: webhookd, app.kubernetes.io/component: scheduler }
